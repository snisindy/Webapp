<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SNI sindy Admin</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fbcfe8">
  <meta name="apple-mobile-web-app-title" content="SNI sindy">
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="manifest" id="manifest">
  
  <style>
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #fdf2f8; 
      -webkit-tap-highlight-color: transparent;
    }
    .glass { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(10px); 
      border: 1px solid #fbcfe8; 
    }
    .input-field { 
      width: 100%; 
      padding: 0.75rem; 
      border-radius: 0.5rem; 
      border: 1px solid #f9a8d4; 
      background-color: white; 
      outline: none; 
      transition: border-color 0.2s; 
      font-family: 'Sarabun', sans-serif;
    }
    .input-field:focus { 
      border-color: #ec4899; 
      box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2);
    }
    .tab-active { 
      color: #db2777; 
      border-bottom: 3px solid #db2777; 
      font-weight: 600; 
    }
    .tab-inactive { 
      color: #9ca3af; 
      border-bottom: 3px solid transparent;
    }
    #loader { 
      display: none; 
    }
  </style>
</head>
<body class="text-gray-800">

  <header class="glass sticky top-0 z-10 px-4 py-3 shadow-sm flex items-center justify-center space-x-3">
    <img src="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png" alt="SNI sindy Logo" class="h-10 w-10 rounded-full shadow-sm object-cover">
    <h1 class="text-xl font-semibold text-pink-600">SNI sindy</h1>
  </header>

  <nav class="flex justify-around bg-white shadow-sm mb-6 text-sm sticky top-[64px] z-10">
    <button onclick="switchTab('add')" id="tab-add" class="w-1/3 py-3 tab-active transition">เพิ่มสินค้า</button>
    <button onclick="switchTab('history')" id="tab-history" class="w-1/3 py-3 tab-inactive transition">ประวัติการขาย</button>
    <button onclick="switchTab('expired')" id="tab-expired" class="w-1/3 py-3 tab-inactive transition">แจ้งเตือนหมดอายุ</button>
  </nav>

  <main class="max-w-3xl mx-auto px-4 pb-20">
    
    <section id="view-add" class="block">
      <div class="glass p-6 rounded-2xl shadow-sm">
        <h2 class="text-lg font-semibold text-pink-600 mb-4 border-b border-pink-100 pb-2">บันทึกรายการขายใหม่</h2>
        <form id="addForm" onsubmit="submitForm(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อลูกค้า</label>
              <input type="text" id="customerName" class="input-field" placeholder="กรอกชื่อลูกค้า" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อทีม / อีเมล / รหัสสินค้า</label>
              <input type="text" id="productCode" class="input-field" placeholder="กรอกข้อมูลอ้างอิง" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อแอปพรีเมียม</label>
              <input type="text" id="appName" class="input-field" placeholder="เช่น Netflix, YouTube Premium" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ระยะเวลา</label>
              <input type="text" id="duration" class="input-field" placeholder="เช่น 30 วัน, 1 ปี" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">วันที่รับสินค้า</label>
              <input type="date" id="startDate" class="input-field" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-pink-600 font-medium">วันที่หมดอายุ (สำหรับแจ้งเตือน)</label>
              <input type="date" id="endDate" class="input-field border-pink-400" required>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm mb-1 text-gray-600 font-medium">ID / Pass สินค้า</label>
              <input type="text" id="accountDetails" class="input-field" placeholder="ข้อมูลบัญชีสำหรับลูกค้า" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">การรับประกัน</label>
              <input type="text" id="warranty" class="input-field" placeholder="เช่น ตลอดอายุการใช้งาน, 30 วัน" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ยอดรวม (บาท)</label>
              <input type="number" id="totalAmount" class="input-field" placeholder="จำนวนเงิน" required>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm mb-1 text-gray-600 font-medium">สลิปยืนยันการโอน</label>
              <input type="file" id="slipFile" accept="image/*" class="input-field bg-pink-50" required>
              <p class="text-xs text-gray-400 mt-1">ระบบจะทำการบีบอัดรูปภาพอัตโนมัติก่อนส่ง</p>
            </div>
          </div>
          <button type="submit" class="w-full mt-6 bg-pink-500 hover:bg-pink-600 text-white font-medium py-3 rounded-xl shadow-md transition duration-200">บันทึกข้อมูลเข้าระบบ</button>
        </form>
      </div>
    </section>

    <section id="view-history" class="hidden">
      <div id="historyContainer" class="space-y-4"></div>
    </section>

    <section id="view-expired" class="hidden">
      <div id="expiredContainer" class="space-y-4"></div>
    </section>

  </main>

  <div id="loader" class="fixed inset-0 bg-white bg-opacity-90 z-50 flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin"></div>
    <p class="mt-4 text-pink-600 font-medium text-lg">กำลังดำเนินการ...</p>
  </div>

  <script>
    // -------------------------------------------------------------
    // === นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้ ===
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzb1ROFu1HuKl42g73lIIZ8CFz4D_29cAVUnhpJ5tbcIfkR6JfNseK7kyIom6dDOuyp/exec';
    // -------------------------------------------------------------

    const manifestJSON = {
      "name": "SNI sindy Admin",
      "short_name": "SNI sindy",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#fdf2f8",
      "theme_color": "#fbcfe8",
      "icons": [{
        "src": "https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png",
        "sizes": "192x192",
        "type": "image/png"
      }]
    };
    
    const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
    document.querySelector('#manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

    window.onload = () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
    };

    function switchTab(tab) {
      document.getElementById('view-add').classList.add('hidden');
      document.getElementById('view-history').classList.add('hidden');
      document.getElementById('view-expired').classList.add('hidden');
      
      document.getElementById('view-' + tab).classList.remove('hidden');

      document.getElementById('tab-add').className = 'w-1/3 py-3 transition ' + (tab === 'add' ? 'tab-active' : 'tab-inactive');
      document.getElementById('tab-history').className = 'w-1/3 py-3 transition ' + (tab === 'history' ? 'tab-active' : 'tab-inactive');
      document.getElementById('tab-expired').className = 'w-1/3 py-3 transition ' + (tab === 'expired' ? 'tab-active' : 'tab-inactive');

      if (tab === 'history' || tab === 'expired') {
        fetchData();
      }
    }

    function toggleLoader(show) {
      document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; 
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = height * (MAX_WIDTH / width);
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function submitForm(e) {
      e.preventDefault();
      
      if(GAS_URL === 'ใส่_WEB_APP_URL_ที่นี่') {
        alert('กรุณาตั้งค่า GAS_URL ในโค้ดก่อนใช้งาน');
        return;
      }

      toggleLoader(true);

      try {
        const slipFile = document.getElementById('slipFile').files[0];
        let slipBase64 = "";
        
        if (slipFile) {
          slipBase64 = await compressImage(slipFile);
        }

        const payload = {
          action: 'add',
          customerName: document.getElementById('customerName').value,
          productCode: document.getElementById('productCode').value,
          appName: document.getElementById('appName').value,
          duration: document.getElementById('duration').value,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value,
          accountDetails: document.getElementById('accountDetails').value,
          warranty: document.getElementById('warranty').value,
          totalAmount: document.getElementById('totalAmount').value,
          slipBase64: slipBase64
        };

        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert('บันทึกข้อมูลเรียบร้อยแล้ว');
          document.getElementById('addForm').reset();
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('startDate').value = today;
          switchTab('history');
        } else {
          alert('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.error);
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
        console.error(error);
      } finally {
        toggleLoader(false);
      }
    }

    async function fetchData() {
      if(GAS_URL === 'ใส่_WEB_APP_URL_ที่นี่') return;
      
      toggleLoader(true);
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'get' })
        });
        
        const result = await response.json();
        
        if (result.success) {
          renderHistory(result.data);
          renderExpired(result.data);
        } else {
          alert('ไม่สามารถดึงข้อมูลได้: ' + result.error);
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการดึงข้อมูล โปรดตรวจสอบอินเทอร์เน็ต');
        console.error(error);
      } finally {
        toggleLoader(false);
      }
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      try {
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString;
        return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch(e) {
        return dateString;
      }
    }

    function createCard(item, isExpiredList) {
      const isClaimed = item['สถานะ'] === 'Claimed';
      const statusColor = isClaimed ? 'bg-gray-100 text-gray-500 border-gray-200' : 'bg-green-50 text-green-600 border-green-200';
      const statusText = isClaimed ? 'เคลมแล้ว' : 'ปกติ';

      let claimButtonHTML = '';
      if (!isClaimed && !isExpiredList) {
        claimButtonHTML = `<button onclick="claimItem('${item['ID']}')" class="mt-4 w-full bg-pink-100 hover:bg-pink-200 text-pink-700 py-2.5 rounded-lg text-sm font-semibold transition duration-200">แจ้งเคลมสินค้า</button>`;
      }

      const safeDateStart = formatDate(item['วันที่เริ่ม']);
      const safeDateEnd = formatDate(item['วันที่หมดอายุ']);

      return `
        <div class="glass p-5 rounded-xl shadow-sm relative">
          <div class="absolute top-5 right-5 px-2 py-1 rounded text-xs border ${statusColor} font-medium">${statusText}</div>
          <h3 class="font-bold text-pink-600 text-lg mb-3 pr-16">${item['ชื่อแอป']}</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-4 text-sm text-gray-700">
            <div><span class="font-semibold text-gray-500">ลูกค้า:</span> ${item['ชื่อลูกค้า']}</div>
            <div><span class="font-semibold text-gray-500">รหัส/อีเมล:</span> ${item['รหัสสินค้า']}</div>
            <div><span class="font-semibold text-gray-500">เริ่ม:</span> ${safeDateStart}</div>
            <div><span class="font-semibold text-pink-500">หมดอายุ:</span> <span class="text-pink-600 font-medium">${safeDateEnd}</span></div>
            <div><span class="font-semibold text-gray-500">ระยะเวลา:</span> ${item['ระยะเวลา']}</div>
            <div><span class="font-semibold text-gray-500">ประกัน:</span> ${item['การประกัน']}</div>
            <div class="col-span-1 md:col-span-2 mt-1 p-2 bg-pink-50 rounded-lg border border-pink-100">
              <span class="font-semibold text-pink-700 block mb-1">ID/Pass:</span> 
              <span class="break-words">${item['ID_Pass']}</span>
            </div>
          </div>
          <div class="flex justify-between items-center mt-3">
            <div class="font-semibold text-gray-800">ยอดรวม: ฿${item['ยอดรวม']}</div>
            ${item['Slip_URL'] ? `<a href="${item['Slip_URL']}" target="_blank" class="text-sm text-pink-500 hover:text-pink-600 underline font-medium">ดูสลิปโอนเงิน</a>` : ''}
          </div>
          ${claimButtonHTML}
        </div>
      `;
    }

    function renderHistory(data) {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';
      
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-10 bg-white rounded-xl shadow-sm border border-gray-100">ยังไม่มีประวัติการขาย</div>';
        return;
      }
      
      data.forEach(item => {
        container.innerHTML += createCard(item, false);
      });
    }

    function renderExpired(data) {
      const container = document.getElementById('expiredContainer');
      container.innerHTML = '';
      
      const today = new Date();
      today.setHours(0,0,0,0);

      const expiredItems = (data || []).filter(item => {
        if (!item['วันที่หมดอายุ'] || item['สถานะ'] === 'Claimed') return false;
        const expDate = new Date(item['วันที่หมดอายุ']);
        return expDate < today;
      });

      if (expiredItems.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-10 bg-white rounded-xl shadow-sm border border-gray-100">ไม่มีรายการสินค้าที่หมดอายุ</div>';
        return;
      }
      
      expiredItems.forEach(item => {
        container.innerHTML += createCard(item, true);
      });
    }

    async function claimItem(id) {
      if(!confirm('คุณต้องการยืนยันการเคลมสินค้ารายการนี้ใช่หรือไม่?')) return;
      
      toggleLoader(true);
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'claim', id: id })
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert('ดำเนินการเคลมสินค้าสำเร็จ');
          fetchData(); 
        } else {
          alert('ไม่สามารถเคลมสินค้าได้: ' + result.error);
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งคำขอ โปรดลองอีกครั้ง');
        console.error(error);
      } finally {
        toggleLoader(false);
      }
    }
  </script>
</body>
</html>
