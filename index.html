<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNI sindy - Web App Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #FAFAFA; color: #333; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #eee; }
        .banner-container { width: 728px; height: 90px; max-width: 100%; object-fit: cover; margin: 0 auto; display: block; border-radius: 8px; background-color: #eee; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #333; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40 transition-all">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://s.imgz.io/2026/07/21/IMG_6481018b99c0e19bc4b2.jpeg" alt="Logo" class="w-10 h-10 rounded-full border">
                <span class="font-semibold text-lg tracking-wide">SNI sindy</span>
            </div>
            <button onclick="promptAdmin()" class="text-xs text-gray-400 hover:text-gray-800 transition">Management</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 pt-24 w-full">
        <!-- Banner -->
        <div class="mb-8 text-center">
            <img id="mainBanner" src="" alt="Banner" class="banner-container shadow-sm hidden">
        </div>

        <div class="text-center mb-10">
            <h1 class="text-2xl font-semibold mb-2">เลือกรูปแบบระบบที่ต้องการ</h1>
            <p class="text-gray-500 text-sm">ปรับแต่งฟังก์ชันเว็บแอปพลิเคชันของคุณได้ตามต้องการ</p>
        </div>

        <!-- Service Categories -->
        <div id="serviceContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <!-- ข้อมูลจะถูกโหลดจาก GAS -->
            <div class="text-center text-gray-400 py-10 w-full col-span-full">กำลังโหลดข้อมูล...</div>
        </div>
    </main>

    <!-- Bottom Bar (Total & Checkout) -->
    <div class="fixed bottom-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-30">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <span class="text-gray-500 text-sm">ยอดรวมทั้งหมด</span>
                <div class="text-2xl font-semibold text-gray-800"><span id="totalPrice">0</span> THB</div>
            </div>
            <button id="checkoutBtn" onclick="openCheckout()" class="bg-black text-white px-8 py-3 rounded-md hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed">
                ชำระเงิน
            </button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-40 hidden z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 mx-4 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeCheckout()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 text-xl">&times;</button>
            <h2 class="text-xl font-semibold mb-4 text-center">ชำระเงิน</h2>
            
            <div class="bg-gray-50 p-4 rounded-lg mb-4 text-center border">
                <p class="text-sm text-gray-500">บัญชีรับเงิน</p>
                <p class="font-medium text-lg">ร้านค้าออมสินมหาเฮง (คิงแอดส์)</p>
                <img src="https://s.imgz.io/2026/07/15/IMG_75242612165b6fd16c31.jpeg" alt="QR Code" class="w-48 h-48 mx-auto my-3 rounded-md shadow-sm">
                <p class="text-sm text-gray-500">ยอดที่ต้องชำระ</p>
                <p class="text-2xl font-semibold text-black"><span id="modalTotal">0</span> THB</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">อัปโหลดสลิปโอนเงิน (ระบบจะตรวจสอบอัตโนมัติ)</label>
                <input type="file" id="slipInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 transition">
                <canvas id="qrCanvas" class="hidden"></canvas>
            </div>

            <button id="confirmOrderBtn" onclick="submitOrder()" class="w-full bg-black text-white py-3 rounded-md hover:bg-gray-800 transition disabled:opacity-50 flex justify-center items-center gap-2">
                ยืนยันการสั่งซื้อ
            </button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="fixed inset-0 bg-white z-[60] hidden overflow-y-auto">
        <div class="max-w-4xl mx-auto p-6">
            <div class="flex justify-between items-center mb-8 border-b pb-4">
                <h2 class="text-2xl font-semibold">ระบบจัดการหลังบ้าน (Admin)</h2>
                <button onclick="closeAdmin()" class="text-gray-500 hover:text-black">ปิดหน้าต่าง &times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Settings -->
                <div class="bg-gray-50 p-6 rounded-lg border">
                    <h3 class="text-lg font-medium mb-4">ตั้งค่าเว็บแอป</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm mb-1">ลิงก์รูปภาพ Banner (728x90)</label>
                            <input type="text" id="adminBanner" class="w-full border rounded p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm mb-1">ข้อความประกาศ (Pop-up)</label>
                            <textarea id="adminPopupText" class="w-full border rounded p-2 text-sm" rows="2"></textarea>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="adminPopupActive">
                            <label class="text-sm">เปิดใช้งานป้ายประกาศ</label>
                        </div>
                        <button onclick="saveAdminSettings()" id="btnSaveSettings" class="bg-black text-white px-4 py-2 rounded text-sm w-full">บันทึกการตั้งค่า</button>
                    </div>
                </div>

                <!-- Add Service -->
                <div class="bg-gray-50 p-6 rounded-lg border">
                    <h3 class="text-lg font-medium mb-4">เพิ่มบริการ / ระบบ</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm mb-1">หมวดหมู่ (เช่น Ministore, Custom)</label>
                            <input type="text" id="adminCat" class="w-full border rounded p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm mb-1">ชื่อระบบ</label>
                            <input type="text" id="adminName" class="w-full border rounded p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm mb-1">ราคา (THB)</label>
                            <input type="number" id="adminPrice" class="w-full border rounded p-2 text-sm">
                        </div>
                        <button onclick="saveAdminService()" id="btnSaveService" class="bg-black text-white px-4 py-2 rounded text-sm w-full">เพิ่มบริการ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ตั้งค่า URL ของ GAS (เปลี่ยนเป็น URL ของคุณ)
        // ==========================================
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzCKTKv7eKFN4SECKNIuYdIuptucRb-u0o56EjAtR11-TZ-NX0a5CsT0O1QvqqhHdWm/exec';
        const ADMIN_PIN = '0000s';
        
        let cart = {};
        let currentTotal = 0;
        let selectedSlipBase64 = null;
        let scannedQRData = null;

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            
            // ตรวจสอบการเลือกไฟล์สลิป
            document.getElementById('slipInput').addEventListener('change', handleSlipUpload);
        });

        // ฟังก์ชันส่งข้อมูลไปยัง GAS API
        async function fetchAPI(payload) {
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                throw error;
            }
        }

        async function fetchData() {
            try {
                const data = await fetchAPI({ action: 'getInitialData' });
                if (data.status === 'success') {
                    renderSettings(data.settings);
                    renderServices(data.services);
                }
            } catch (error) {
                document.getElementById('serviceContainer').innerHTML = '<div class="col-span-full text-center text-red-500">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';
            }
        }

        function renderSettings(settings) {
            // Banner
            if (settings.BannerURL) {
                const banner = document.getElementById('mainBanner');
                banner.src = settings.BannerURL;
                banner.classList.remove('hidden');
            }

            // Popup
            if (settings.PopupActive === 'true' && settings.PopupText) {
                Swal.fire({
                    title: 'ประกาศ',
                    text: settings.PopupText,
                    confirmButtonText: 'รับทราบ',
                    confirmButtonColor: '#000'
                });
            }

            // นำข้อมูลไปใส่ในหน้า Admin รอไว้
            document.getElementById('adminBanner').value = settings.BannerURL || '';
            document.getElementById('adminPopupText').value = settings.PopupText || '';
            document.getElementById('adminPopupActive').checked = (settings.PopupActive === 'true');
        }

        function renderServices(services) {
            const container = document.getElementById('serviceContainer');
            container.innerHTML = '';
            
            // จัดกลุ่มตาม Category
            const grouped = services.reduce((acc, curr) => {
                (acc[curr.category] = acc[curr.category] || []).push(curr);
                return acc;
            }, {});

            for (const [category, items] of Object.entries(grouped)) {
                let html = `
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm h-fit">
                        <h2 class="text-lg font-medium border-b pb-2 mb-4 text-gray-800">${category}</h2>
                        <div class="space-y-3">
                `;
                
                items.forEach(item => {
                    html += `
                        <label class="flex items-center justify-between cursor-pointer p-3 rounded hover:bg-gray-50 transition border border-transparent hover:border-gray-200">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" class="w-4 h-4 text-black border-gray-300 rounded focus:ring-black accent-black" 
                                    onchange="toggleItem('${item.name}', ${item.price}, this.checked)">
                                <span class="text-sm">${item.name}</span>
                            </div>
                            <span class="text-sm font-medium text-gray-600">${item.price} ฿</span>
                        </label>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        // ระบบตะกร้าคำนวณราคา
        function toggleItem(name, price, isChecked) {
            if (isChecked) {
                cart[name] = price;
            } else {
                delete cart[name];
            }
            calculateTotal();
        }

        function calculateTotal() {
            currentTotal = Object.values(cart).reduce((a, b) => a + Number(b), 0);
            document.getElementById('totalPrice').innerText = currentTotal.toLocaleString();
            document.getElementById('modalTotal').innerText = currentTotal.toLocaleString();
            
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = currentTotal === 0;
        }

        // ระบบ Checkout
        function openCheckout() {
            if (currentTotal === 0) return;
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // รีเซ็ตไฟล์ input
            document.getElementById('slipInput').value = '';
            selectedSlipBase64 = null;
            scannedQRData = null;
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // อ่านภาพสลิปและแกะ QR Code 
        function handleSlipUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                selectedSlipBase64 = event.target.result;
                
                // ตรวจสอบ QR ในรูปภาพ
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('qrCanvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) {
                        scannedQRData = code.data;
                        validatePromptPayAmount(scannedQRData);
                    } else {
                        Swal.fire({
                            icon: 'warning',
                            title: 'ไม่พบ QR Code',
                            text: 'ไม่สามารถอ่าน QR Code บนสลิปได้ โปรดตรวจสอบภาพอีกครั้ง',
                            confirmButtonColor: '#000'
                        });
                        document.getElementById('slipInput').value = '';
                        selectedSlipBase64 = null;
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // แกะยอดเงินจาก PromptPay Payload (Tag 54)
        function validatePromptPayAmount(payload) {
            let amount = 0;
            try {
                // โครงสร้าง PromptPay TLV (Tag-Length-Value)
                // ค้นหา Tag 54 (Transaction Amount)
                const tag54Index = payload.indexOf('54');
                if (tag54Index !== -1) {
                    // อ่านความยาว (2 หลักถัดไป)
                    const length = parseInt(payload.substring(tag54Index + 2, tag54Index + 4));
                    // อ่านค่าตามความยาว
                    const amountStr = payload.substring(tag54Index + 4, tag54Index + 4 + length);
                    amount = parseFloat(amountStr);
                }
            } catch (e) {
                console.error("Parse Error", e);
            }

            if (amount > 0) {
                if (amount < currentTotal) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ยอดเงินไม่ถูกต้อง',
                        text: `ยอดโอนในสลิป (${amount} บาท) ไม่ตรงกับยอดที่ต้องชำระ (${currentTotal} บาท)`,
                        confirmButtonColor: '#000'
                    });
                    document.getElementById('slipInput').value = '';
                    selectedSlipBase64 = null;
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: 'ตรวจสอบสลิปสำเร็จ',
                        text: `ยอดเงินถูกต้อง (${amount} บาท)`,
                        confirmButtonColor: '#000',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'สลิปนี้ไม่มียอดเงินในคิวอาร์',
                    text: 'ระบบจะส่งให้ Admin ตรวจสอบด้วยตนเอง',
                    confirmButtonColor: '#000'
                });
            }
        }

        async function submitOrder() {
            if (!selectedSlipBase64) {
                Swal.fire('แจ้งเตือน', 'กรุณาอัปโหลดสลิปโอนเงิน', 'warning');
                return;
            }

            const btn = document.getElementById('confirmOrderBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> กำลังดำเนินการ...';

            const itemsStr = Object.keys(cart).join(', ');

            const payload = {
                action: 'checkout',
                items: itemsStr,
                total: currentTotal,
                slipBase64: selectedSlipBase64,
                qrData: scannedQRData
            };

            try {
                const response = await fetchAPI(payload);
                if (response.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'สั่งซื้อสำเร็จ!',
                        text: `รหัสรายการ: ${response.orderId}`,
                        confirmButtonColor: '#000'
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    Swal.fire('ข้อผิดพลาด', response.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'ยืนยันการสั่งซื้อ';
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                btn.disabled = false;
                btn.innerHTML = 'ยืนยันการสั่งซื้อ';
            }
        }

        // ==========================================
        // Admin ระบบหลังบ้าน
        // ==========================================
        function promptAdmin() {
            Swal.fire({
                title: 'เข้าสู่ระบบจัดการ',
                input: 'password',
                inputPlaceholder: 'กรอกรหัสผ่าน',
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#000'
            }).then((result) => {
                if (result.value === ADMIN_PIN) {
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                } else if (result.value) {
                    Swal.fire('ผิดพลาด', 'รหัสผ่านไม่ถูกต้อง', 'error');
                }
            });
        }

        function closeAdmin() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        async function saveAdminSettings() {
            const btn = document.getElementById('btnSaveSettings');
            btn.disabled = true;
            btn.innerHTML = 'กำลังบันทึก...';

            const payload = {
                action: 'adminUpdateSettings',
                bannerUrl: document.getElementById('adminBanner').value,
                popupText: document.getElementById('adminPopupText').value,
                popupActive: document.getElementById('adminPopupActive').checked.toString()
            };

            await fetchAPI(payload);
            Swal.fire('สำเร็จ', 'บันทึกการตั้งค่าแล้ว', 'success');
            btn.disabled = false;
            btn.innerHTML = 'บันทึกการตั้งค่า';
        }

        async function saveAdminService() {
            const cat = document.getElementById('adminCat').value;
            const name = document.getElementById('adminName').value;
            const price = document.getElementById('adminPrice').value;

            if (!cat || !name || !price) {
                Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
                return;
            }

            const btn = document.getElementById('btnSaveService');
            btn.disabled = true;
            btn.innerHTML = 'กำลังบันทึก...';

            const payload = {
                action: 'adminAddService',
                category: cat,
                name: name,
                price: price
            };

            await fetchAPI(payload);
            Swal.fire('สำเร็จ', 'เพิ่มบริการเรียบร้อย รีเฟรชหน้าเว็บเพื่อดูผลลัพธ์', 'success');
            
            document.getElementById('adminName').value = '';
            document.getElementById('adminPrice').value = '';
            
            btn.disabled = false;
            btn.innerHTML = 'เพิ่มบริการ';
        }
    </script>
</body>
</html>
