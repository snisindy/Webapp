<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SNI sindy Admin</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="SNI sindy">
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" id="manifest">
  
  <style>
    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: #fafafa; 
      -webkit-tap-highlight-color: transparent;
      color: #333333;
    }
    .glass-header { 
      background: rgba(255, 255, 255, 0.98); 
      backdrop-filter: blur(12px); 
      border-bottom: 1px solid #fce7f3;
    }
    .minimal-card {
      background: #ffffff;
      border: 1px solid #fdf2f8;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      border-radius: 1rem;
    }
    .stat-box {
      background: linear-gradient(145deg, #ffffff, #fdf2f8);
      border: 1px solid #fce7f3;
      border-radius: 1rem;
    }
    .input-field { 
      width: 100%; 
      padding: 0.85rem 1rem; 
      border-radius: 0.75rem; 
      border: 1px solid #fbcfe8; 
      background-color: #ffffff; 
      outline: none; 
      transition: all 0.25s ease; 
      font-family: 'Sarabun', sans-serif;
      font-size: 0.95rem;
    }
    .input-field:focus { 
      border-color: #ec4899; 
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }
    .tab-active { 
      color: #db2777; 
      border-bottom: 2px solid #db2777; 
      font-weight: 600; 
    }
    .tab-inactive { 
      color: #9ca3af; 
      border-bottom: 2px solid transparent;
    }
    .fab-btn {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      background-color: #ec4899;
      color: white;
      border-radius: 9999px;
      width: 3.5rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      z-index: 40;
      transition: transform 0.2s;
    }
    .fab-btn:active { transform: scale(0.95); }
    
    /* Animations */
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="glass-header sticky top-0 z-30 px-4 py-3 flex items-center justify-center space-x-3">
    <img src="https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png" alt="SNI sindy Logo" class="h-10 w-10 rounded-full shadow-sm object-cover">
    <h1 class="text-xl font-bold tracking-wide" style="color: #d61f69;">SNI sindy</h1>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-24 pt-6">
    
    <!-- Dashboard Stats -->
    <div class="grid grid-cols-3 gap-3 mb-8">
      <div class="stat-box p-4 text-center">
        <p class="text-xs font-medium text-gray-500 mb-1">ยอดขายทั้งหมด</p>
        <h2 id="stat-count" class="text-2xl font-bold text-gray-800">0</h2>
      </div>
      <div class="stat-box p-4 text-center">
        <p class="text-xs font-medium text-gray-500 mb-1">ยอดเงินรวม (บาท)</p>
        <h2 id="stat-revenue" class="text-2xl font-bold text-pink-600">0</h2>
      </div>
      <div class="stat-box p-4 text-center">
        <p class="text-xs font-medium text-gray-500 mb-1">อยู่ในประกัน</p>
        <h2 id="stat-warranty" class="text-2xl font-bold text-green-600">0</h2>
      </div>
    </div>

    <!-- Tabs -->
    <nav class="flex justify-around bg-white rounded-xl shadow-sm mb-6 text-sm border border-gray-100 overflow-hidden">
      <button onclick="switchTab('history')" id="tab-history" class="w-1/2 py-3 tab-active transition bg-white">ประวัติการขายทั้งหมด</button>
      <button onclick="switchTab('expired')" id="tab-expired" class="w-1/2 py-3 tab-inactive transition bg-white">แจ้งเตือนใกล้หมดอายุ</button>
    </nav>

    <!-- Lists -->
    <section id="view-history" class="block space-y-4"></section>
    <section id="view-expired" class="hidden space-y-4"></section>

  </main>

  <!-- Floating Action Button -->
  <button onclick="openModal()" class="fab-btn">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
  </button>

  <!-- Modal Pop-up (เพิ่มสินค้า) -->
  <div id="addModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="absolute inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white rounded-t-2xl md:rounded-2xl shadow-2xl w-full md:w-[600px] max-h-[90vh] overflow-y-auto transform transition-transform fade-in">
      
      <div class="sticky top-0 bg-white/95 backdrop-blur px-6 py-4 border-b border-gray-100 flex justify-between items-center z-10">
        <h2 class="text-lg font-bold text-gray-800">บันทึกรายการขายใหม่</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-pink-500 bg-gray-50 rounded-full p-1.5 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      
      <div class="p-6">
        <form id="addForm" onsubmit="submitForm(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อลูกค้า</label>
              <input type="text" id="customerName" class="input-field" placeholder="กรอกชื่อลูกค้า" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อทีม / อีเมล / รหัสสินค้า</label>
              <input type="text" id="productCode" class="input-field" placeholder="ข้อมูลอ้างอิง" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ชื่อแอปพรีเมียม</label>
              <input type="text" id="appName" class="input-field" placeholder="เช่น Netflix, Spotify" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ระยะเวลา</label>
              <input type="text" id="duration" class="input-field" placeholder="เช่น 30 วัน, 1 ปี" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">วันที่รับสินค้า</label>
              <input type="date" id="startDate" class="input-field" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">วันที่หมดอายุ</label>
              <input type="date" id="endDate" class="input-field" required>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm mb-1 text-gray-600 font-medium">ID / Pass สินค้า</label>
              <input type="text" id="accountDetails" class="input-field" placeholder="ข้อมูลบัญชี" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">การรับประกัน</label>
              <input type="text" id="warranty" class="input-field" placeholder="เช่น ตลอดอายุ, 30 วัน" required>
            </div>
            <div>
              <label class="block text-sm mb-1 text-gray-600 font-medium">ยอดรวม (บาท)</label>
              <input type="number" id="totalAmount" class="input-field" placeholder="0.00" required>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm mb-1 text-gray-600 font-medium">สลิปยืนยันการโอน</label>
              <input type="file" id="slipFile" accept="image/*" class="input-field border-dashed" required>
            </div>
          </div>
          <div class="pt-4 pb-2">
            <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-pink-200 transition duration-200">บันทึกข้อมูล</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center">
    <div class="w-10 h-10 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // === นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้ ===
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwpZKnc7jebyEWtF1_wTERuFEKBooQ2N23PyFsAIewYUH-atQYXBFdG2b-PMQLY1t_D/exec';
    // -------------------------------------------------------------

    let globalData = [];

    const manifestJSON = {
      "name": "SNI sindy Admin",
      "short_name": "SNI sindy",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#ffffff",
      "icons": [{
        "src": "https://i.postimg.cc/SR2Bb66y/DA0D2171-669F-4863-B0AD-A3084C2E881A.png",
        "sizes": "192x192",
        "type": "image/png"
      }]
    };
    
    document.querySelector('#manifest').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'})));

    window.onload = () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      fetchData(); // ดึงข้อมูลทันทีเมื่อเปิดแอป
    };

    function switchTab(tab) {
      document.getElementById('view-history').classList.add('hidden');
      document.getElementById('view-expired').classList.add('hidden');
      document.getElementById('view-' + tab).classList.remove('hidden');

      document.getElementById('tab-history').className = 'w-1/2 py-3 transition ' + (tab === 'history' ? 'tab-active bg-pink-50/50' : 'tab-inactive bg-white');
      document.getElementById('tab-expired').className = 'w-1/2 py-3 transition ' + (tab === 'expired' ? 'tab-active bg-pink-50/50' : 'tab-inactive bg-white');
    }

    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // กันหน้าพื้นหลังเลื่อน
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function toggleLoader(show) {
      document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    // บีบอัดรูป
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500; 
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = height * (MAX_WIDTH / width);
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            resolve(dataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    async function submitForm(e) {
      e.preventDefault();
      
      if(GAS_URL === 'ใส่_WEB_APP_URL_ที่นี่') {
        alert('กรุณาตั้งค่า GAS_URL ในโค้ดก่อนใช้งาน');
        return;
      }

      toggleLoader(true);

      try {
        const slipFile = document.getElementById('slipFile').files[0];
        let slipBase64 = slipFile ? await compressImage(slipFile) : "";

        const payload = {
          action: 'add',
          customerName: document.getElementById('customerName').value,
          productCode: document.getElementById('productCode').value,
          appName: document.getElementById('appName').value,
          duration: document.getElementById('duration').value,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value,
          accountDetails: document.getElementById('accountDetails').value,
          warranty: document.getElementById('warranty').value,
          totalAmount: document.getElementById('totalAmount').value,
          slipBase64: slipBase64
        };

        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: "follow"
        });
        
        const rawText = await response.text();
        const result = JSON.parse(rawText);
        
        if (result.success) {
          document.getElementById('addForm').reset();
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('startDate').value = today;
          closeModal();
          fetchData(); // รีเฟรชข้อมูลอัตโนมัติ
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.error);
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
        console.error(error);
      } finally {
        toggleLoader(false);
      }
    }

    async function fetchData() {
      if(GAS_URL === 'ใส่_WEB_APP_URL_ที่นี่') return;
      
      toggleLoader(true);
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'get' }),
          redirect: "follow"
        });
        
        const rawText = await response.text();
        const result = JSON.parse(rawText);
        
        if (result.success) {
          globalData = result.data || [];
          calculateStats(globalData);
          renderHistory(globalData);
          renderExpired(globalData);
        }
      } catch (error) {
        console.error(error);
      } finally {
        toggleLoader(false);
      }
    }

    function calculateStats(data) {
      let totalSold = data.length;
      let totalRevenue = 0;
      let activeWarranty = 0;
      
      const today = new Date();
      today.setHours(0,0,0,0);

      data.forEach(item => {
        totalRevenue += parseFloat(item['ยอดรวม']) || 0;
        
        if (item['สถานะ'] !== 'Claimed') {
          if (!item['วันที่หมดอายุ']) {
            activeWarranty++;
          } else {
            let expDate = new Date(item['วันที่หมดอายุ']);
            if (expDate >= today) {
              activeWarranty++;
            }
          }
        }
      });

      document.getElementById('stat-count').innerText = totalSold.toLocaleString();
      document.getElementById('stat-revenue').innerText = totalRevenue.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      document.getElementById('stat-warranty').innerText = activeWarranty.toLocaleString();
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      try {
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString;
        return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch(e) {
        return dateString;
      }
    }

    function createCard(item, isExpiredList) {
      const isClaimed = item['สถานะ'] === 'Claimed';
      const statusClass = isClaimed 
        ? 'bg-gray-100 text-gray-500 border border-gray-200' 
        : 'bg-green-50 text-green-600 border border-green-100';
      const statusText = isClaimed ? 'เคลมแล้ว' : 'ปกติ';

      let claimButtonHTML = '';
      if (!isClaimed && !isExpiredList) {
        claimButtonHTML = `<button onclick="claimItem('${item['ID']}')" class="mt-4 w-full bg-pink-50 hover:bg-pink-100 text-pink-600 border border-pink-100 py-2.5 rounded-lg text-sm font-semibold transition">แจ้งเคลมสินค้า</button>`;
      }

      return `
        <div class="minimal-card p-5 fade-in relative">
          <div class="absolute top-5 right-5 px-2.5 py-1 rounded-md text-[11px] font-medium ${statusClass}">${statusText}</div>
          
          <h3 class="font-bold text-gray-800 text-lg mb-4 pr-16 border-b border-gray-50 pb-2">${item['ชื่อแอป']}</h3>
          
          <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-gray-600">
            <div><span class="text-gray-400 text-xs block mb-0.5">ลูกค้า</span> <span class="font-medium">${item['ชื่อลูกค้า']}</span></div>
            <div><span class="text-gray-400 text-xs block mb-0.5">รหัส/อีเมล</span> <span class="font-medium">${item['รหัสสินค้า']}</span></div>
            
            <div><span class="text-gray-400 text-xs block mb-0.5">วันที่เริ่ม</span> <span class="font-medium">${formatDate(item['วันที่เริ่ม'])}</span></div>
            <div><span class="text-pink-400 text-xs block mb-0.5">วันหมดอายุ</span> <span class="font-medium text-pink-600">${formatDate(item['วันที่หมดอายุ'])}</span></div>
            
            <div class="col-span-2 bg-gray-50 p-3 rounded-lg mt-1">
              <span class="text-gray-400 text-xs block mb-1">ID/Pass</span>
              <span class="font-medium text-gray-800 break-words tracking-wide">${item['ID_Pass']}</span>
            </div>
            
            <div class="col-span-2 flex justify-between items-center mt-2">
              <div><span class="text-gray-400 text-xs block">ประกัน: ${item['การประกัน']}</span></div>
              ${item['Slip_URL'] ? `<a href="${item['Slip_URL']}" target="_blank" class="text-sm text-blue-500 hover:text-blue-600 underline decoration-blue-200 underline-offset-2">ดูสลิป</a>` : ''}
            </div>
          </div>
          
          ${claimButtonHTML}
        </div>
      `;
    }

    function renderHistory(data) {
      const container = document.getElementById('view-history');
      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-10 minimal-card">ยังไม่มีประวัติการขาย</div>';
        return;
      }
      data.forEach(item => { container.innerHTML += createCard(item, false); });
    }

    function renderExpired(data) {
      const container = document.getElementById('view-expired');
      container.innerHTML = '';
      
      const today = new Date();
      today.setHours(0,0,0,0);

      const expiredItems = (data || []).filter(item => {
        if (!item['วันที่หมดอายุ'] || item['สถานะ'] === 'Claimed') return false;
        const expDate = new Date(item['วันที่หมดอายุ']);
        return expDate < today;
      });

      if (expiredItems.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-10 minimal-card">ไม่มีรายการที่หมดอายุ</div>';
        return;
      }
      expiredItems.forEach(item => { container.innerHTML += createCard(item, true); });
    }

    async function claimItem(id) {
      if(!confirm('ยืนยันการเคลมสินค้ารายการนี้?')) return;
      toggleLoader(true);
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'claim', id: id }),
          redirect: "follow"
        });
        const rawText = await response.text();
        const result = JSON.parse(rawText);
        if (result.success) {
          fetchData(); 
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งคำขอ');
      } finally {
        toggleLoader(false);
      }
    }
  </script>
</body>
</html>
